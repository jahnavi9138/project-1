<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#143c34">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
  <title>Campus Register</title>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="mast"><div class="mast-inner">
    <a class="brand" href="#directory" aria-label="Campus Register home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>Campus Register</a>
    <nav id="navigation" aria-label="Main navigation" hidden>
      <a href="#directory" data-nav="directory">Directory</a>
      <a href="#attendance" data-nav="attendance">Attendance</a>
    </nav>
    <button class="signout" id="signout" hidden>Sign out</button>
  </div></header>
  <main id="main" tabindex="-1"><p class="loading">Opening the register…</p></main>
  <p id="notice" class="notice" role="status" hidden></p>
  <dialog id="editor" aria-labelledby="dialog-title">
    <form id="editor-form">
      <div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="close" aria-label="Close dialog" data-close>×</button></div>
      <div id="dialog-fields"></div>
      <p id="dialog-error" class="error" role="alert" hidden></p>
      <div class="dialog-actions"><span id="dialog-extra"></span><button class="btn secondary" type="button" data-close>Cancel</button><button class="btn primary" id="dialog-submit" type="submit">Save</button></div>
    </form>
  </dialog>
  <noscript><p>This register needs JavaScript. Enable it in your browser and reload.</p></noscript>
</body>
</html>
